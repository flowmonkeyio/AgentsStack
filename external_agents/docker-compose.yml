version: '3.8'

services:
  # =========================================================================
  # Image Generation Agent (MCP-based)
  # =========================================================================
  image-gen-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    container_name: agentstack-image-gen-mcp

    ports:
      - "3001:3000"  # Host:Container

    environment:
      # Agent Configuration
      AGENT_NAME: ImageGenerator
      AGENT_VERSION: "1.0.0"
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0

      # OpenRouter API (REQUIRED - set in .env file)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_DEFAULT_MODEL: google/gemini-2.0-flash-exp:image
      OPENROUTER_FALLBACK_MODEL: openai/gpt-5-image-mini

      # Task Storage
      TASK_STORE_TYPE: redis
      REDIS_URL: redis://redis:6379
      REDIS_DB: 0
      TASK_TTL_SECONDS: 3600

      # Timeouts
      IMAGE_GENERATION_TIMEOUT: 300000  # 5 minutes
      HTTP_REQUEST_TIMEOUT: 60000       # 1 minute
      MAX_CONCURRENT_TASKS: 10

      # Callbacks
      CALLBACK_TIMEOUT: 10000
      CALLBACK_RETRY_ATTEMPTS: 3
      CALLBACK_RETRY_DELAY: 1000

      # Logging
      LOG_LEVEL: info
      LOG_FORMAT: json

      # Cost
      DEFAULT_IMAGE_COST: 0.08

      # Agent Registration
      AGENT_WALLET_ADDRESS: "0x0000000000000000000000000000000000000000"
      AGENT_BASE_PRICE: 0.08
      AGENT_CAPABILITIES: "hero images, social graphics, product mockups, illustrations"

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - agentstack-network

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # =========================================================================
  # Redis (Task State Storage)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: agentstack-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    restart: unless-stopped

    networks:
      - agentstack-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  agentstack-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
